<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>살아있는 생활관 — LnL</title>
  <meta name="description" content="관악학생생활관 LnL의 방 9개를 잇는 미디어아트 메인 화면">
  <meta name="theme-color" content="#141A2E">
  <link rel="stylesheet" href="shared/design.css">
  <link rel="stylesheet" href="main/main.css">
  <script src="shared/lnl.js"></script>
</head>
<body class="scene-page">
  <canvas id="scene" class="scene-canvas" aria-hidden="true"></canvas>

  <div id="room-tags" class="room-tags" role="group" aria-label="생활관 방 목록"></div>

  <header class="scene-top">
    <h1 class="scene-title">살아있는 생활관</h1>
    <p class="scene-meta"><span id="clock">--:--</span> · <span id="phase"></span> · <span id="weather">날씨 확인 중</span></p>
    <ul class="scene-stats" aria-live="polite">
      <li>지금 <strong id="stat-people">0</strong>명</li>
      <li>오늘 기록 <strong id="stat-records">0</strong>개</li>
    </ul>
  </header>

  <footer class="scene-bottom">
    <button id="tilt-btn" type="button" class="lnl-btn lnl-btn--ghost" hidden>기울여서 빛 움직이기</button>
  </footer>

  <p id="demo-badge" class="demo-badge" hidden>데모 모드 · Supabase 연결 전이라 기록과 접속자가 가짜로 만들어져요</p>

  <dialog id="room-panel" class="room-panel" aria-label="앱 고르기"></dialog>

  <script type="module" src="main/main.js"></script>
</body>
</html>
