<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>살아있는 생활관 — LnL</title>
  <meta name="description" content="관악학생생활관 LnL 919C·919D동에 내 방 불을 켜고, 공용 공간에서 방 앱 9개로 들어가는 미디어아트 메인 화면">
  <meta name="theme-color" content="#141A2E">
  <link rel="stylesheet" href="shared/design.css">
  <link rel="stylesheet" href="main/main.css">
  <script src="shared/lnl.js"></script>
</head>
<body class="scene-page">
  <canvas id="scene" class="scene-canvas" aria-hidden="true"></canvas>

  <header class="scene-top">
    <h1 class="scene-title">살아있는 생활관</h1>
    <p class="scene-meta"><span id="clock">--:--</span> · <span id="phase"></span> · <span id="weather">날씨 확인 중</span></p>
    <ul class="scene-stats" aria-live="polite">
      <li>지금 <strong id="stat-people">0</strong>명</li>
      <li>불 켜진 방 <strong id="stat-dorms">0</strong></li>
      <li>오늘 기록 <strong id="stat-records">0</strong></li>
    </ul>
    <p id="demo-badge" class="demo-badge" hidden>데모 모드 · Supabase 연결 전이라 불빛과 접속자 일부가 가짜예요</p>
  </header>

  <footer class="scene-bottom">
    <div id="room-tags" class="room-tags" role="group" aria-label="공용 공간 — 방 앱으로 들어가기"></div>
    <div class="scene-actions">
      <button id="dorm-btn" type="button" class="lnl-btn">내 방 불 켜기</button>
      <button id="tilt-btn" type="button" class="lnl-btn lnl-btn--ghost" hidden>기울여서 빛 움직이기</button>
    </div>
  </footer>

  <p id="dorm-tip" class="dorm-tip" hidden></p>
  <p id="toast" class="toast" role="status" hidden></p>

  <dialog id="room-panel" class="room-panel" aria-label="앱 고르기"></dialog>

  <dialog id="dorm-panel" class="room-panel dorm-panel" aria-labelledby="dorm-title">
    <form id="dorm-form" novalidate>
      <div class="room-panel__head">
        <h2 id="dorm-title" class="room-panel__title">내 방 불 켜기</h2>
        <button id="dorm-close" type="button" class="room-panel__close">닫기</button>
      </div>
      <p class="room-panel__hint">919C동은 15~18호, 919D동은 19~22호예요. 층(1~9)과 호수를 붙여 써 주세요.</p>
      <label class="dorm-panel__label" for="dorm-input">호실 번호</label>
      <input id="dorm-input" class="dorm-panel__input" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="예: 215">
      <p id="dorm-preview" class="dorm-panel__preview" aria-live="polite"></p>
      <button type="submit" class="lnl-btn dorm-panel__submit">불 켜기</button>
      <p class="dorm-panel__note">호실 번호만 남고 이름은 남지 않아요. 불빛은 오늘 자정까지 켜져 있어요.</p>
    </form>
  </dialog>

  <script type="module" src="main/main.js"></script>
</body>
</html>
